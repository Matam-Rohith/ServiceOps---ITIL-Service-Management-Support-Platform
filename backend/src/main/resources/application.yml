server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: serviceops-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/serviceops_db}
    username: ${SPRING_DATASOURCE_USERNAME:serviceops_user}
    password: ${SPRING_DATASOURCE_PASSWORD:serviceops_secure_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# SLA Calculation Background Scheduler
serviceops:
  sla:
    calculation-rate-ms: 10000 # Evaluate SLA deadlines every 10 seconds

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.serviceops: DEBUG
    org.springframework.security: INFO
